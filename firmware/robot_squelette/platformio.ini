; ESP32 robot - VERSION SQUELETTE À COMPLÉTER
; Les fonctions de mouvement sont vides (TODO) : à toi de les écrire.
; Le reste (WiFi, ESP-NOW, OTA, heartbeat) fonctionne déjà.
;
; Depuis ce dossier :
;   pio run -e robot1 -t upload       USB : flashe le robot n°1
;   pio run -e robot3 -t upload       USB : flashe le robot n°3
;   pio run -e robot1-ota -t upload   OTA (après un premier flash USB)
;   pio device monitor                moniteur série (115200 bauds)

[platformio]
src_dir = robot
default_envs = robot1

[env]
platform = espressif32@^6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_extra_dirs = ../lib          ; bibliothèque TrivialProtocol (protocole commun)

; Pied commun OTA (hérité par chaque env robotN-ota). Remplace upload_port par
; l'IP du robot si mDNS ne fonctionne pas (Windows sans Bonjour).
[env:_ota]
upload_protocol = espota
upload_flags = --auth=trivial-ota-2026

[env:robot1]
build_flags = -DROBOT_ID=1
[env:robot1-ota]
extends = env:robot1, env:_ota
upload_port = trivial-robot-1.local

[env:robot2]
build_flags = -DROBOT_ID=2
[env:robot2-ota]
extends = env:robot2, env:_ota
upload_port = trivial-robot-2.local

[env:robot3]
build_flags = -DROBOT_ID=3
[env:robot3-ota]
extends = env:robot3, env:_ota
upload_port = trivial-robot-3.local

[env:robot4]
build_flags = -DROBOT_ID=4
[env:robot4-ota]
extends = env:robot4, env:_ota
upload_port = trivial-robot-4.local

[env:robot5]
build_flags = -DROBOT_ID=5
[env:robot5-ota]
extends = env:robot5, env:_ota
upload_port = trivial-robot-5.local

[env:robot6]
build_flags = -DROBOT_ID=6
[env:robot6-ota]
extends = env:robot6, env:_ota
upload_port = trivial-robot-6.local
