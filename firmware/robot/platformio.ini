; ESP32 robot (PlatformIO). Depuis ce dossier :
;   pio run -e robot3 -t upload    compile et flashe un robot avec ROBOT_ID = 3
;   pio run                        compile le robot 1 (vérification)
;   pio device monitor             moniteur série (115200 bauds)
; Le sketch reste compatible IDE Arduino (voir README).

[platformio]
src_dir = .
default_envs = robot1

[env]
platform = espressif32@^6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter = +<*> -<.pio/>
lib_extra_dirs = ../lib          ; bibliothèque TrivialProtocol (protocole commun)

; Un environnement par robot : ROBOT_ID est passé à la compilation.
[env:robot1]
build_flags = -DROBOT_ID=1

[env:robot2]
build_flags = -DROBOT_ID=2

[env:robot3]
build_flags = -DROBOT_ID=3

[env:robot4]
build_flags = -DROBOT_ID=4

[env:robot5]
build_flags = -DROBOT_ID=5

[env:robot6]
build_flags = -DROBOT_ID=6
