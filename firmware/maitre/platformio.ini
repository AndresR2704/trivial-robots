; ESP32 maître (PlatformIO). Depuis ce dossier :
;   pio run                        compile
;   pio run -t upload              compile et flashe par USB
;   pio run -e maitre-ota -t upload  mise à jour OTA (PC connecté au WiFi TrivialRobots)
;   pio device monitor             moniteur série (115200 bauds)
; Le sketch reste compatible IDE Arduino (voir README).

[platformio]
src_dir = .

[env:maitre]
platform = espressif32@^6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter = +<*> -<.pio/>
lib_extra_dirs = ../lib          ; bibliothèque TrivialProtocol (protocole commun)
lib_deps = links2004/WebSockets@^2.6.1

; OTA : même binaire que maitre, flashé par WiFi.
; Si trivial-master.local ne résout pas (mDNS indispo sur Windows sans Bonjour),
; remplacer upload_port par 192.168.4.1.
[env:maitre-ota]
extends = env:maitre
upload_protocol = espota
upload_port = trivial-master.local
upload_flags = --auth=trivial-ota-2026
