; ESP32 maître (PlatformIO). Depuis ce dossier :
;   pio run               compile
;   pio run -t upload     compile et flashe
;   pio device monitor    moniteur série (115200 bauds)
; Le sketch reste compatible IDE Arduino (voir README).

[platformio]
src_dir = .

[env:maitre]
platform = espressif32@^6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter = +<*> -<.pio/>
lib_extra_dirs = ../lib          ; bibliothèque TrivialProtocol (protocole commun)
lib_deps = links2004/WebSockets@^2.6.1
